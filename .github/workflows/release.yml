name: 'Create Release'

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Chinese Education Platform ${{ github.ref_name }}'
          releaseBody: |
            ## Changes in ${{ github.ref_name }}

            ### 🚀 Features
            - Multi-platform desktop application
            - Cross-platform support (Windows, macOS, Linux)
            - Native file dialogs
            - Enhanced security with desktop sandboxing

            ### 🐛 Bug Fixes
            - File handling improvements
            - Performance optimizations

            ### ⬆️ Improvements
            - Better user experience on desktop
            - Offline capabilities for core features

            ## 📦 Downloads

            Choose the appropriate download for your platform:
            - **Windows**: `.exe` or `.msi` installer
            - **macOS**: `.dmg` disk image
            - **Linux**: `.deb` package or `.AppImage`

            ## 🚀 Installation

            ### Windows
            1. Download `.exe` or `.msi`
            2. Run installer
            3. Follow setup instructions

            ### macOS
            1. Download `.dmg`
            2. Open disk image
            3. Drag app to Applications folder

            ### Linux
            1. Download `.deb` (Ubuntu/Debian) or `.AppImage` (universal)
            2. Install with package manager or run directly

            ## 📋 Requirements

            - Windows 10+ / macOS 10.13+ / Linux (Ubuntu 18.04+)
            - Internet connection for API calls
            - 500MB free disk space

            ---

            Full documentation available at [GitHub Repository](https://github.com/your-username/chinese-education-platform)
          releaseDraft: false
          prerelease: false
          includeDebug: false
          includeRelease: true